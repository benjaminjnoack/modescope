<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mode Wheel</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 2rem 1rem;
    }
    svg {
      width: 100%;
      max-width: 400px;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>Mode Wheel</h1>
  <svg id="wheel" viewBox="-200 -200 400 400"></svg>

  <script>
    const NOTES = ["C", "C♯/D♭", "D", "D♯/E♭", "E", "F", "F♯/G♭", "G", "G♯/A♭", "A", "A♯/B♭", "B"];
    const SVG_NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("wheel");

    const outerRadius = 180;
    const innerRadius = 100;
    const labelRadius = (outerRadius + innerRadius) / 2;

    // Convert a wheel angle (0 = straight up, clockwise, in degrees) to x/y.
    function point(radius, degrees) {
      const rad = (degrees - 90) * Math.PI / 180;
      return [Math.cos(rad) * radius, Math.sin(rad) * radius];
    }

    NOTES.forEach((note, i) => {
      // Each note gets a 30-degree segment centered on its position.
      const center = i * 30;
      const start = center - 15;
      const end = center + 15;

      const [ox1, oy1] = point(outerRadius, start);
      const [ox2, oy2] = point(outerRadius, end);
      const [ix2, iy2] = point(innerRadius, end);
      const [ix1, iy1] = point(innerRadius, start);

      const segment = document.createElementNS(SVG_NS, "path");
      segment.setAttribute("d", [
        `M ${ox1} ${oy1}`,
        `A ${outerRadius} ${outerRadius} 0 0 1 ${ox2} ${oy2}`,
        `L ${ix2} ${iy2}`,
        `A ${innerRadius} ${innerRadius} 0 0 0 ${ix1} ${iy1}`,
        "Z",
      ].join(" "));
      segment.setAttribute("fill", "white");
      segment.setAttribute("stroke", "black");
      svg.appendChild(segment);

      const [lx, ly] = point(labelRadius, center);
      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("x", lx);
      label.setAttribute("y", ly);
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("dominant-baseline", "central");
      label.setAttribute("font-size", "16");
      label.textContent = note;
      svg.appendChild(label);
    });
  </script>
</body>
</html>
