<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mode Wheel</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 2rem 1rem;
    }
    svg {
      width: 100%;
      max-width: 400px;
      height: auto;
      touch-action: none; /* Let us handle touch drags instead of scrolling. */
      user-select: none;
    }
    #segments { cursor: grab; }
    #segments.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <h1>Mode Wheel</h1>
  <svg id="wheel" viewBox="-220 -220 440 440">
    <g id="segments"></g>
    <g id="numerals"></g>
    <text id="key-name" x="0" y="-8" text-anchor="middle" font-size="32" font-weight="bold"></text>
    <text id="mode-name" x="0" y="24" text-anchor="middle" font-size="18">Ionian</text>
  </svg>

  <script>
    const NOTES = ["C", "C♯/D♭", "D", "D♯/E♭", "E", "F", "F♯/G♭", "G", "G♯/A♭", "A", "A♯/B♭", "B"];
    const SVG_NS = "http://www.w3.org/2000/svg";
    const STEP = 360 / NOTES.length;

    // Semitones above the tonic for each note of the Ionian (major) mode,
    // with the Roman numeral for the chord built on that degree.
    const IONIAN = [0, 2, 4, 5, 7, 9, 11];
    const IONIAN_NUMERALS = ["I", "ii", "iii", "IV", "V", "vi", "vii°"];

    const svg = document.getElementById("wheel");
    const group = document.getElementById("segments");

    const outerRadius = 180;
    const innerRadius = 100;
    const labelRadius = (outerRadius + innerRadius) / 2;

    // How far the wheel is turned, in degrees clockwise.
    let rotation = 0;

    // Convert a wheel angle (0 = straight up, clockwise, in degrees) to x/y.
    function point(radius, degrees) {
      const rad = (degrees - 90) * Math.PI / 180;
      return [Math.cos(rad) * radius, Math.sin(rad) * radius];
    }

    // The note currently under the "I" at the top (the tonic).
    function selectedIndex() {
      const steps = Math.round(-rotation / STEP);
      return ((steps % NOTES.length) + NOTES.length) % NOTES.length;
    }

    // Build one segment and one label per note.
    const segments = NOTES.map((note) => {
      const path = document.createElementNS(SVG_NS, "path");
      path.setAttribute("stroke", "black");
      group.appendChild(path);

      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("dominant-baseline", "central");
      label.setAttribute("font-size", "16");
      label.textContent = note;
      group.appendChild(label);

      return { path, label };
    });

    // Redraw the wheel at the current rotation. Labels move but stay upright.
    function render() {
      const selected = selectedIndex();
      document.getElementById("key-name").textContent = NOTES[selected];
      segments.forEach(({ path, label }, i) => {
        const center = i * STEP + rotation;
        const start = center - STEP / 2;
        const end = center + STEP / 2;

        const [ox1, oy1] = point(outerRadius, start);
        const [ox2, oy2] = point(outerRadius, end);
        const [ix2, iy2] = point(innerRadius, end);
        const [ix1, iy1] = point(innerRadius, start);

        path.setAttribute("d", [
          `M ${ox1} ${oy1}`,
          `A ${outerRadius} ${outerRadius} 0 0 1 ${ox2} ${oy2}`,
          `L ${ix2} ${iy2}`,
          `A ${innerRadius} ${innerRadius} 0 0 0 ${ix1} ${iy1}`,
          "Z",
        ].join(" "));
        const interval = (i - selected + NOTES.length) % NOTES.length;
        let fill = "white";
        if (interval === 0) fill = "gold";               // Tonic, under the "I".
        else if (IONIAN.includes(interval)) fill = "lightyellow"; // Other mode notes.
        path.setAttribute("fill", fill);

        const [lx, ly] = point(labelRadius, center);
        label.setAttribute("x", lx);
        label.setAttribute("y", ly);
      });
    }

    // Roman numerals stay fixed outside the ring, one per mode degree.
    // "I" sits at the top and marks the tonic.
    const numeralRadius = outerRadius + 20;
    const numeralGroup = document.getElementById("numerals");
    IONIAN.forEach((interval, degree) => {
      const [x, y] = point(numeralRadius, interval * STEP);
      const text = document.createElementNS(SVG_NS, "text");
      text.setAttribute("x", x);
      text.setAttribute("y", y);
      text.setAttribute("text-anchor", "middle");
      text.setAttribute("dominant-baseline", "central");
      text.setAttribute("font-size", "16");
      text.setAttribute("font-weight", "bold");
      text.textContent = IONIAN_NUMERALS[degree];
      numeralGroup.appendChild(text);
    });

    // Angle of a pointer event around the wheel's center (0 = up, clockwise).
    function eventAngle(event) {
      const pt = svg.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      const { x, y } = pt.matrixTransform(svg.getScreenCTM().inverse());
      return Math.atan2(y, x) * 180 / Math.PI + 90;
    }

    // Dragging: turn the wheel with the pointer, then snap to the nearest note.
    let dragStartAngle = null;
    let dragStartRotation = 0;

    group.addEventListener("pointerdown", (event) => {
      dragStartAngle = eventAngle(event);
      dragStartRotation = rotation;
      group.setPointerCapture(event.pointerId);
      group.classList.add("dragging");
    });

    group.addEventListener("pointermove", (event) => {
      if (dragStartAngle === null) return;
      rotation = dragStartRotation + (eventAngle(event) - dragStartAngle);
      render();
    });

    function endDrag() {
      if (dragStartAngle === null) return;
      dragStartAngle = null;
      group.classList.remove("dragging");
      rotation = Math.round(rotation / STEP) * STEP;
      render();
    }
    group.addEventListener("pointerup", endDrag);
    group.addEventListener("pointercancel", endDrag);

    render();
  </script>
</body>
</html>
