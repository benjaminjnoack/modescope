# Publish public/ to GitHub Pages on every push to master.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # Allow manual runs from the Actions tab.

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Name the service worker's cache after this commit, so every deploy
      # replaces the copy that home-screen installs keep. The grep fails the
      # deploy if the sed ever stops matching.
      - name: Stamp the service worker with this commit
        run: |
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::7}\";/" public/sw.js
          grep -q "^const VERSION = \"${GITHUB_SHA::7}\";" public/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
